services:
  nginx:
    image: nginx:alpine
    container_name: mcarchive_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    networks:
      - mcarchive_net

  web:
    image: ghcr.io/thalisonnunes20/mcarchive:latest
    build: .
    container_name: mcarchive_web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - ALLOWED_HOSTS=*
      - SECRET_KEY=django-insecure-mca-sqlite-standalone-key-mcarchive-2026
      - DB_NAME=
      - DB_SQLITE_PATH=/app/data/db.sqlite3
      - SECURE_SSL_REDIRECT=False
      - SESSION_COOKIE_SECURE=False
      - CSRF_COOKIE_SECURE=False
    volumes:
      - sqlite_data:/app/data
      - static_data:/app/staticfiles
      - media_data:/app/media
      - logs_data:/app/logs
    networks:
      - mcarchive_net

volumes:
  sqlite_data:
    driver: local
  static_data:
    driver: local
  media_data:
    driver: local
  logs_data:
    driver: local

networks:
  mcarchive_net:
    driver: bridge
