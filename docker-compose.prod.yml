services:
  mcarchive:
    image: ghcr.io/thalisonnunes20/mcarchive:latest
    container_name: mcarchive_standalone
    restart: unless-stopped
    pull_policy: always
    ports:
      - "80:80"
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_SQLITE_PATH=/app/data/db.sqlite3
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-mca-default-secret-key-change-in-production-1234567890}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-False}
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - logs_data:/app/logs

volumes:
  sqlite_data:
    driver: local
  media_data:
    driver: local
  logs_data:
    driver: local
