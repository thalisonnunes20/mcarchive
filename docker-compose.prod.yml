services:
  nginx:
    image: nginx:alpine
    container_name: mcarchive_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    networks:
      - mcarchive_net

  web:
    image: ghcr.io/thalisonnunes20/mcarchive:latest
    container_name: mcarchive_web
    restart: unless-stopped
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_SQLITE_PATH=/app/data/db.sqlite3
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-mca-default-secret-key-change-in-production-1234567890}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - logs_data:/app/logs
      - sqlite_data:/app/data
    depends_on:
      - db
    networks:
      - mcarchive_net

  db:
    image: postgres:16-alpine
    container_name: mcarchive_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mcarchive}
      POSTGRES_USER: ${DB_USER:-mcarchive_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcarchive_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mcarchive_net

volumes:
  static_data:
    driver: local
  media_data:
    driver: local
  logs_data:
    driver: local
  sqlite_data:
    driver: local
  postgres_data:
    driver: local

networks:
  mcarchive_net:
    driver: bridge

