services:
  db:
    image: postgres:16-alpine
    container_name: mcarchive_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mcarchive}
      POSTGRES_USER: ${DB_USER:-mcarchive_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcarchive_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mcarchive_user} -d ${DB_NAME:-mcarchive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcarchive_net

  web:
    build: .
    container_name: mcarchive_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcarchive_net

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  logs_data:
    driver: local

networks:
  mcarchive_net:
    driver: bridge

