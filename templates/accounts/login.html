{% extends "base.html" %}
{% block title %}Login — Minecraft Archive{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">

        <div class="text-center mb-4">
          <i class="bi bi-shield-lock text-danger" style="font-size:2.5rem;"></i>
          <h4 class="text-white mt-2">Acesso Administrativo</h4>
        </div>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label text-light">Usuário</label>
            <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
                   autofocus required>
          </div>

          <div class="mb-4">
            <label class="form-label text-light">Senha</label>
            <input type="password" name="password" class="form-control bg-dark text-light border-secondary"
                   required>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
          </button>
        </form>

      </div>
    </div>
  </div>
{% endblock %}
